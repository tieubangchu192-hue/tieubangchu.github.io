<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiêu Bang Chủ — Trang Cá Nhân</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif;}
        body {background: #f0f4f8; min-height: 100vh; padding: 20px;}
        .container {max-width: 600px; margin: 0 auto; background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);}
        h1 {text-align: center; color: #1a202c; margin-bottom: 10px; font-size: 24px;}
        .subtitle {text-align: center; color: #667eea; font-weight: 600; margin-bottom: 30px;}
        p {color: #4a5568; line-height: 1.8; margin-bottom: 20px; text-align: center;}
        .links {display: flex; flex-direction: column; gap: 12px; margin-top: 30px;}
        .link {padding: 14px; background: #667eea; color: white; text-decoration: none; border-radius: 8px; text-align: center; font-weight: 500;}
        footer {text-align: center; margin-top: 30px; color: #718096; font-size: 14px;}
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 Xin chào, tôi là Tiêu Bang Chủ</h1>
        <p class="subtitle">Người tạo nội dung & Game LIVE</p>
        <p>Chào mừng bạn đến với trang cá nhân của tôi! 🎉</p>
        <div class="links">
            <a href="#" class="link">📱 Kênh TikTok</a>
            <a href="#" class="link">🎮 Game của tôi</a>
            <a href="#" class="link">📧 Liên hệ</a>
        </div>
        <footer>© 2026 Tiêu Bang Chủ</footer>
    </div>
</body>
</html>
